<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TravelMap — Sign In</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=5">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=5">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v4.png">
  <link rel="manifest" href="manifest.webmanifest?v=6">
  <meta name="theme-color" content="#0b0d19">
  <script>
    // Fast path: this device had a session last time — skip the Firebase
    // bounce (SDK download + auth resolution) and go straight to the map.
    // map.html's own auth guard redirects back here if the session is gone.
    try {
      if (localStorage.getItem('tm-has-session') === '1') {
        const token = new URLSearchParams(location.search).get('token');
        location.replace(token ? 'map.html?token=' + encodeURIComponent(token) : 'map.html');
      }
    } catch (e) { /* storage unavailable — normal sign-in flow */ }
  </script>
  <link rel="stylesheet" href="css/style.css?v=45">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <h1><img src="icons/logo-mark.png?v=4" alt="" style="height:44px;vertical-align:middle;margin-right:10px"> TravelMap</h1>
      <p data-i18n="auth.tagline">Track your travels on the world map</p>
      <!-- Spinner while Firebase resolves the persisted session — prevents
           the sign-in button flashing for already-logged-in users -->
      <div id="auth-loading" class="auth-loading"></div>
      <div id="auth-signin-area" class="auth-hidden">
      <button class="btn-google" id="btn-signin">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span data-i18n="auth.signin">Sign in with Google</span>
      </button>
      <!-- Nur in der iOS-App sichtbar (Guideline 4.8), siehe Skript unten -->
      <button class="btn-google btn-apple auth-hidden" id="btn-signin-apple">
        <svg width="16" height="18" viewBox="0 0 814 1000" aria-hidden="true">
          <path fill="#000" d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
        </svg>
        <span data-i18n="auth.signinApple">Sign in with Apple</span>
      </button>
      <p class="auth-error" id="auth-error"></p>
      <p class="auth-privacy">
        <span data-i18n="auth.privacyNotice">By signing in you accept our</span>
        <a href="privacy.html" target="_blank" rel="noopener" data-i18n="auth.privacyLink">Privacy Policy</a>
      </p>
      </div><!-- /auth-signin-area -->
    </div>
  </div>

  <script type="module">
    import { signInWithGoogle, signInWithApple, onAuthChange } from './js/auth.js?v=23';
    import { isNative } from './js/platform.js?v=1';
    import { t, applyTranslations } from './js/i18n.js?v=7';

    applyTranslations();

    function goToMap() {
      const token = new URLSearchParams(window.location.search).get('token');
      window.location.href = token ? `map.html?token=${encodeURIComponent(token)}` : 'map.html';
    }

    // Laeuft ein Klick-Login, leitet der Klick-Handler selbst weiter, erst
    // wenn alles fertig ist. Sonst bricht der Seitenwechsel z.B. das
    // Nachtragen von Apples Namen ab.
    let signingIn = false;

    // Schon eingeloggt? → direkt weiterleiten (Token erhalten falls vorhanden).
    // Bis der Auth-Status feststeht, läuft nur der Spinner — so blitzt der
    // Login-Button für eingeloggte Nutzer nicht mehr auf.
    onAuthChange(user => {
      if (user) {
        if (!signingIn) goToMap();
        return;
      }
      document.getElementById('auth-loading').classList.add('auth-hidden');
      document.getElementById('auth-signin-area').classList.remove('auth-hidden');
    });

    async function runSignIn(signIn) {
      signingIn = true;
      document.getElementById('auth-error').textContent = '';
      try {
        await signIn();
        goToMap();
      } catch (err) {
        signingIn = false;
        document.getElementById('auth-error').textContent = t('auth.error');
        console.error(err);
      }
    }

    document.getElementById('btn-signin').addEventListener('click', () => runSignIn(signInWithGoogle));

    if (isNative()) {
      const appleBtn = document.getElementById('btn-signin-apple');
      appleBtn.classList.remove('auth-hidden');
      appleBtn.addEventListener('click', () => runSignIn(signInWithApple));
    }
  </script>
</body>
</html>
