<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelMap — Sign In</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=5">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=5">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v4.png">
  <link rel="manifest" href="manifest.webmanifest?v=6">
  <meta name="theme-color" content="#0b0d19">
  <script>
    // Fast path: this device had a session last time — skip the Firebase
    // bounce (SDK download + auth resolution) and go straight to the map.
    // map.html's own auth guard redirects back here if the session is gone.
    try {
      if (localStorage.getItem('tm-has-session') === '1') {
        const token = new URLSearchParams(location.search).get('token');
        location.replace(token ? 'map.html?token=' + encodeURIComponent(token) : 'map.html');
      }
    } catch (e) { /* storage unavailable — normal sign-in flow */ }
  </script>
  <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <h1><img src="icons/logo-mark.png?v=4" alt="" style="height:44px;vertical-align:middle;margin-right:10px"> TravelMap</h1>
      <p data-i18n="auth.tagline">Track your travels on the world map</p>
      <!-- Spinner while Firebase resolves the persisted session — prevents
           the sign-in button flashing for already-logged-in users -->
      <div id="auth-loading" class="auth-loading"></div>
      <div id="auth-signin-area" class="auth-hidden">
      <button class="btn-google" id="btn-signin">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span data-i18n="auth.signin">Sign in with Google</span>
      </button>
      <p class="auth-error" id="auth-error"></p>
      <p class="auth-privacy">
        <span data-i18n="auth.privacyNotice">By signing in you accept our</span>
        <a href="privacy.html" target="_blank" rel="noopener" data-i18n="auth.privacyLink">Privacy Policy</a>
      </p>
      </div><!-- /auth-signin-area -->
    </div>
  </div>

  <script type="module">
    import { signInWithGoogle, onAuthChange } from './js/auth.js?v=20';
    import { t, applyTranslations } from './js/i18n.js?v=1';

    applyTranslations();

    // Schon eingeloggt? → direkt weiterleiten (Token erhalten falls vorhanden).
    // Bis der Auth-Status feststeht, läuft nur der Spinner — so blitzt der
    // Login-Button für eingeloggte Nutzer nicht mehr auf.
    onAuthChange(user => {
      if (user) {
        const params = new URLSearchParams(window.location.search);
        const token  = params.get('token');
        window.location.href = token ? `map.html?token=${encodeURIComponent(token)}` : 'map.html';
        return;
      }
      document.getElementById('auth-loading').classList.add('auth-hidden');
      document.getElementById('auth-signin-area').classList.remove('auth-hidden');
    });

    document.getElementById('btn-signin').addEventListener('click', async () => {
      try {
        await signInWithGoogle();
        // onAuthChange übernimmt den Redirect
      } catch (err) {
        document.getElementById('auth-error').textContent = t('auth.error');
        console.error(err);
      }
    });
  </script>
</body>
</html>
